<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1">
  <title>Town Square Demo</title>
  <style>
    :root { --bg: #08060c; --fg: #b8aecb; --dim: #6f6684; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 13px/1.4 monospace; }
    body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; }
    .frame { position: relative; box-shadow: 0 0 0 3px #2a2433, 0 0 40px #000; }
    .frame canvas { display: block; image-rendering: pixelated; }
    .log {
      position: absolute; left: 0; top: 0; pointer-events: none;
      font-family: VT323, monospace; color: #f0e4c8; line-height: 1;
      text-shadow: 1px 0 #000, -1px 0 #000, 0 1px #000, 0 2px #000;
    }
    .log div { transition: opacity 1s; }
    .help { color: var(--dim); text-align: center; max-width: 960px; padding: 0 16px; }
    .help b { color: var(--fg); }
    /* phones: see engine/touch.js, which sets html[data-layout] */
    html[data-layout="portrait"] body, html[data-layout="landscape"] body { height: 100vh; height: 100dvh; overflow: hidden; }
    html[data-layout="portrait"] body { justify-content: flex-start; gap: 0; }
    html[data-layout="portrait"] .frame, html[data-layout="landscape"] .frame { box-shadow: none; }
    html[data-layout="portrait"] .keys, html[data-layout="landscape"] .keys,
    html[data-layout="landscape"] #status, html[data-layout="landscape"] #ui { display: none; }
    html[data-layout="portrait"] #status { font-size: 10px; line-height: 1.3; padding: 6px 12px 0; }
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;700&family=VT323&display=swap" rel="stylesheet">
  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js" } }
  </script>
</head>
<body>
  <div class="frame" id="frame">
    <canvas id="view"></canvas>
    <canvas id="ui"></canvas>
  </div>
  <div class="help keys">
    <b>W/S</b> or <b>↑/↓</b> move · <b>A/D</b> strafe · <b>Q/E</b> or <b>←/→</b> turn ·
    <b>T</b> smooth movement · <b>F</b> fog · <b>V</b> far sprite variants · <b>L</b> point lights · <b>I</b> ink outlines
  </div>
  <div class="help" id="status">Loading…</div>
  <script type="module">
    import { startGame } from '../engine/game.js';
    import { town, tileTypes, manifest, uiLayout } from './town.js';
    startGame({
      level: town, tileTypes, manifest, uiLayout, assetPath: './assets',
      viewCanvas: document.getElementById('view'),
      uiCanvas: document.getElementById('ui'),
      frame: document.getElementById('frame'),
      status: document.getElementById('status'),
    }).catch((e) => { document.getElementById('status').textContent = 'Error: ' + e.message; console.error(e); });
  </script>
</body>
</html>
