<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Old Quarter Demo</title>
  <style>
    :root { --bg: #08060c; --fg: #b8aecb; --dim: #6f6684; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 13px/1.4 monospace; }
    body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; }
    .frame { position: relative; box-shadow: 0 0 0 3px #2a2433, 0 0 40px #000; }
    .frame canvas { display: block; image-rendering: pixelated; }
    .log {
      position: absolute; left: 0; pointer-events: none;
      font-family: VT323, monospace; color: #f0e4c8; line-height: 1;
      text-shadow: 1px 0 #000, -1px 0 #000, 0 1px #000, 0 2px #000;
    }
    .log div { transition: opacity 1s; }
    .help { color: var(--dim); text-align: center; max-width: 960px; padding: 0 16px; }
    .help b { color: var(--fg); }
    .help button { font: inherit; color: var(--fg); background: #1a1524; border: 1px solid #3a3148; padding: 2px 10px; cursor: pointer; }
    .help button:hover { border-color: var(--fg); }
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;700&family=VT323&display=swap" rel="stylesheet">
</head>
<body>
  <div class="frame" id="frame">
    <canvas id="view"></canvas>
    <canvas id="ui"></canvas>
  </div>
  <div class="help">
    <b>W/S</b> or <b>↑/↓</b> move · <b>A/D</b> strafe · <b>Q/E</b> or <b>←/→</b> turn · <b>O</b> slot outlines · <b>P</b> sampling / smooth scaling · <b>R</b> resolution
  </div>
  <div class="help"><button id="scaling" type="button"></button> <button id="resolution" type="button"></button></div>
  <div class="help" id="status">Loading…</div>
  <script type="module">
    import { startGame2d } from '../engine2d/game.js';
    import { quarter, tileTypes, props } from './quarter.js';
    import { uiLayout } from '../game-1/town.js';
    startGame2d({
      level: quarter, tileTypes, props, uiLayout,
      assetPath: './assets', uiAssetPath: '../game-1/assets',
      viewCanvas: document.getElementById('view'),
      uiCanvas: document.getElementById('ui'),
      frame: document.getElementById('frame'),
      status: document.getElementById('status'),
      scalingButton: document.getElementById('scaling'),
      resolutionButton: document.getElementById('resolution'),
    }).catch((e) => { document.getElementById('status').textContent = 'Error: ' + e.message; console.error(e); });
  </script>
</body>
</html>
