<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Old Quarter Demo (pixel slice)</title>
  <style>
    :root { --bg: #08060c; --fg: #b8aecb; --dim: #6f6684; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 13px/1.4 monospace; }
    body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; }
    #game { box-shadow: 0 0 0 3px #2a2433, 0 0 40px #000; }
    .help { color: var(--dim); text-align: center; max-width: 960px; padding: 0 16px; }
    .help b { color: var(--fg); }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div class="help">
    <span id="res">pixel slice</span> · <b>W/S</b> or <b>↑/↓</b> move · <b>A/D</b> strafe · <b>Q/E</b> or <b>←/→</b> turn · <b>O</b> slot outlines
  </div>
  <div class="help" id="status">Loading…</div>
  <script type="module">
    import { startGame } from '../../engine/index.js';
    import { content } from '../../games/ravensmoor/content/index.js';
    import { quarterPx, pixelContent, PX } from './quarter-px.js';

    document.getElementById('res').textContent = `${PX.width}x${PX.height} pixel slice`;
    startGame({
      title: 'Pixel slice', saveKey: 'pixel-slice', characterCreation: false,
      content: [content, pixelContent], levels: { village: quarterPx }, start: 'village',
      canvas: document.getElementById('game'),
      status: document.getElementById('status'),
    }).catch((e) => { document.getElementById('status').textContent = 'Error: ' + e.message; console.error(e); });
  </script>
</body>
</html>
